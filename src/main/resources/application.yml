spring:
  application:
    name: login-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/login;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
app:
  demo: ${APP_DEMO:false}
